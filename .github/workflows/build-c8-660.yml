name: build-c8-660

on:
  workflow_dispatch:
  push:
    branches: [c8-660-25.12]
    paths:
      - '.github/workflows/build-c8-660.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /opt/az /usr/lib/jvm || true
          sudo apt-get -y purge -qq '^mongodb-.*' '^mysql-.*' azure-cli google-chrome-stable \
            firefox powershell mono-devel || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get -y install -qq build-essential clang flex bison g++ gawk gettext \
            libncurses-dev libssl-dev python3-setuptools python3-pyelftools rsync swig \
            unzip zlib1g-dev file wget libelf-dev time

      - name: Feeds
        run: |
          # QModem (5G module manager) as an extra feed
          echo "src-git qmodem https://github.com/FUjr/QModem.git;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Extra packages
        run: |
          # OpenClash ships its LuCI app as a plain package dir, no feed
          git clone --depth 1 https://github.com/vernesong/OpenClash.git /tmp/openclash
          cp -r /tmp/openclash/luci-app-openclash package/
          ls package/luci-app-openclash

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_nradio_c8-660=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-package-manager=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_luci-app-qmodem-next=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          EOF
          make defconfig
          grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_nradio_c8-660=y' .config \
            || { echo "device profile not selected"; exit 1; }
          for sym in luci-app-openclash luci-app-qmodem-next qmodem; do
            grep -q "^CONFIG_PACKAGE_$sym=y" .config || { echo "package $sym not selected"; exit 1; }
          done
          grep -E 'CONFIG_TARGET_(BOARD|SUBTARGET)|DEVICE_nradio|CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        run: make -j$(nproc) download || make -j1 download

      - name: Build
        run: |
          make -j$(nproc) || { tail -n 300 build_dir/*/linux-*/vmlinux 2>/dev/null; exit 1; }

      - name: Collect
        run: |
          mkdir -p out
          cp -v bin/targets/mediatek/filogic/*nradio_c8-660* out/ 2>/dev/null || true
          cp -v bin/targets/mediatek/filogic/*.json bin/targets/mediatek/filogic/sha256sums out/ 2>/dev/null || true
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-c8-660
          path: out/*
          if-no-files-found: error
          retention-days: 30
